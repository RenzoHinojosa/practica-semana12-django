{% extends 'base.html' %}{% block content %}<p class="etiqueta">FORMULARIOS Y VALIDACIÓN</p><h1>{{ titulo }}</h1><section class="formulario"><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<p><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</p>{% endfor %}<button type="submit">Guardar</button></form></section>{% endblock %}
