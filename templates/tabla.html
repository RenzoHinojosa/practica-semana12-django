<div class="tabla"><table><thead><tr><th>Código</th><th>Título</th><th>Usuario</th><th>Fechas</th><th>Estado</th></tr></thead><tbody>{% for s in solicitudes %}<tr><td>{{ s.codigo }}</td><td>{{ s.titulo }}</td><td>{{ s.propietario.username }}</td><td>{{ s.fecha_inicio|date:'d/m/Y' }} → {{ s.fecha_fin|date:'d/m/Y' }}</td><td><span class="estado">{{ s.get_estado_display }}</span></td></tr>{% empty %}<tr><td colspan="5">Aún no hay solicitudes. Crea la primera desde el menú.</td></tr>{% endfor %}</tbody></table></div>
